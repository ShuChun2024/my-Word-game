<!DOCTYPE html>
<html lang="zh-TW">等一中回來再說
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>英文單字全方位四合一挑戰</title>
    <script src="https://tailwindcss.com"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col items-center p-4">

    <header class="w-full max-w-md text-center my-4">
        <h1 class="text-2xl font-bold text-indigo-600">🎯 多功能單字挑戰賽</h1>
        <p class="text-xs text-slate-500 mt-1">單字與例句全模式隨機混搭 · 記憶效果加倍</p>
    </header>

    <!-- 區塊一：資料輸入 -->
    <main id="setup-screen" class="w-full max-w-md bg-white p-6 rounded-2xl shadow-sm border border-slate-100 space-y-4">
        <div>
            <label class="block text-sm font-semibold text-slate-700 mb-2">步驟 1：上傳您的文字筆記檔 (.txt)</label>
            <input type="file" id="file-input" accept=".txt" class="block w-full text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100 cursor-pointer"/>
        </div>
        
        <div>
            <label class="block text-sm font-semibold text-slate-700 mb-1">或直接在下方貼上文字內容：</label>
            <textarea id="text-input" rows="10" class="w-full p-3 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500" placeholder="直接複製您的單字與例句貼到這裡..."></textarea>
        </div>

        <button id="start-btn" class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-medium rounded-xl shadow-lg shadow-indigo-100 transition-all active:scale-[0.98]">
            🚀 開始生成題目
        </button>
    </main>

    <!-- 區塊二：遊戲測驗區 -->
    <main id="game-screen" class="w-full max-w-md bg-white p-6 rounded-2xl shadow-sm border border-slate-100 space-y-5 hidden">
        <div class="flex justify-between items-center text-sm font-medium text-slate-500">
            <span id="progress">題目：0 / 0</span>
            <span id="mode-badge" class="px-2 py-0.5 text-xs rounded-full font-bold"></span>
            <span id="score-board" class="text-emerald-600">得分：0</span>
        </div>

        <!-- 題目核心區 -->
        <div class="space-y-4 bg-slate-50 p-4 rounded-xl border border-slate-100">
            
            <!-- 模式 1：純單字挑戰（中翻英 / 英翻中 共用區） -->
            <div id="q-vocab-box" class="hidden">
                <div id="q-vocab-title" class="text-xs font-bold uppercase tracking-wider mb-1"></div>
                <div id="q-vocab-main" class="text-2xl font-bold text-slate-800 tracking-wide"></div>
            </div>

            <!-- 模式 2：例句克漏字區 -->
            <div id="q-sentence-box" class="hidden">
                <div class="text-xs font-bold text-indigo-500 uppercase tracking-wider mb-1">英文例句 (克漏字)</div>
                <div id="q-sentence" class="text-base font-medium text-slate-800 leading-relaxed italic"></div>
                <div class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-1 mt-2">例句中譯</div>
                <div id="q-chinese" class="text-sm text-slate-600"></div>
            </div>
            
            <!-- 模式 3：例句中翻英區 -->
            <div id="q-sentence-ch-box" class="hidden">
                <div class="text-xs font-bold text-cyan-600 uppercase tracking-wider mb-1">請依據中文句意，選出正確的英文單字：</div>
                <div id="q-sentence-only-ch" class="text-lg font-bold text-slate-800 leading-relaxed"></div>
            </div>

            <!-- 核心提示區：只有在特定模式下做補充提示 -->
            <div id="q-target-meaning-box" class="pt-2 border-t border-slate-200/60 hidden">
                <div class="text-xs font-bold text-amber-500 uppercase tracking-wider mb-1">提示 (單字字義)</div>
                <div id="q-target-meaning" class="text-sm font-semibold text-slate-700"></div>
            </div>
            
            <!-- 延伸出題重點 (答案揭曉後才顯示) -->
            <div id="q-focus-box" class="pt-2 border-t border-slate-200/60 hidden">
                <!-- 答題後顯示完整英文例句與字義對照 -->
                <div id="q-review-box" class="mb-2 space-y-1">
                    <div class="text-xs font-bold text-slate-400 uppercase tracking-wider">核心對照</div>
                    <div id="q-review-vocab" class="text-sm font-bold text-indigo-600"></div>
                    <div id="q-review-sentence" class="text-xs italic text-slate-600"></div>
                </div>
                <div id="q-focus-title-div" class="text-xs font-bold text-emerald-500 uppercase tracking-wider mb-1">💡 出題重點</div>
                <div id="q-focus" class="text-xs text-slate-500 whitespace-pre-line"></div>
            </div>
        </div>

        <!-- 四選一按鈕 -->
        <div id="options-container" class="grid grid-cols-1 gap-2.5"></div>

        <!-- 下一題按鈕 -->
        <button id="next-btn" class="w-full py-3 bg-slate-800 hover:bg-slate-900 text-white font-medium rounded-xl hidden transition-all">
            下一題 ➡️
        </button>
    </main>

    <!-- 區塊三：結算畫面 -->
    <main id="result-screen" class="w-full max-w-md bg-white p-6 rounded-2xl shadow-sm border border-slate-100 text-center space-y-4 hidden">
        <h2 class="text-2xl font-bold text-slate-800">🎉 挑戰完成！</h2>
        <p id="final-score" class="text-xl font-medium text-indigo-600"></p>
        <button onclick="location.reload()" class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-medium rounded-xl">
            再挑戰一次
        </button>
    </main>

    <script>
        let quizBank = [];
        let currentIndex = 0;
        let score = 0;

        const setupScreen = document.getElementById('setup-screen');
        const gameScreen = document.getElementById('game-screen');
        const resultScreen = document.getElementById('result-screen');
        const fileInput = document.getElementById('file-input');
        const textInput = document.getElementById('text-input');

        fileInput.addEventListener('change', (e) => {
            const file = e.target.files;
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => textInput.value = e.target.result;
            reader.readAsText(file);
        });

        document.getElementById('start-btn').addEventListener('click', () => {
            const text = textInput.value.trim();
            if (!text) return alert('請先輸入或上傳單字筆記！');

            const blocks = text.split(/\n\s*\n+/);
            quizBank = [];

            blocks.forEach(block => {
                const lines = block.split('\n').map(l => l.trim()).filter(l => l.length > 0);
                if (lines.length < 2) return;

                let vocabList = [];
                let sentenceEng = '';
                let sentenceCh = '';
                let focusText = '';
                let isFocus = false;

                for (let i = 0; i < lines.length; i++) {
                    const line = lines[i];

                    if (line.includes('出題重點')) {
                        isFocus = true;
                        continue;
                    }
                    if (isFocus) {
                        focusText += line + '\n';
                        continue;
                    }

                    const isEnglishSentence = /^[A-Za-z]/.test(line) && (line.split(' ').length > 3 || line.includes('.'));
                    
                    if (isEnglishSentence && !sentenceEng) {
                        sentenceEng = line;
                        if (i + 1 < lines.length && !lines[i+1].includes('出題重點')) {
                            sentenceCh = lines[i+1];
                            i++;
                        }
                    } else {
                        if (/^[A-Za-z-]+$/.test(line) && i + 1 < lines.length && !/^[A-Za-z]/.test(lines[i+1])) {
                            vocabList.push({ word: line, meaning: lines[i+1] });
                            i++;
                        }
                    }
                }

                if (vocabList.length > 0) {
                    quizBank.push({
                        vocabularies: vocabList,
                        sentenceEng: sentenceEng,
                        sentenceCh: sentenceCh,
                        focus: focusText.trim()
                    });
                }
            });

            if (quizBank.length < 1) return alert('未能成功解析單字項目，請檢查格式！');

            quizBank.sort(() => Math.random() - 0.5);
            setupScreen.classList.add('hidden');
            gameScreen.classList.remove('hidden');
            loadQuestion();
        });

        function loadQuestion() {
            if (currentIndex >= quizBank.length) {
                showResult();
                return;
            }

            const currentGroup = quizBank[currentIndex];
            
            // 隨機在組內抓一個單字作為目標單字
            let targetItem = currentGroup.vocabularies[Math.floor(Math.random() * currentGroup.vocabularies.length)];
            // 如果有英文例句且該例句包含組內的某個字，提高點中它的機率
            if (currentGroup.sentenceEng) {
                for (let v of currentGroup.vocabularies) {
                    if (currentGroup.sentenceEng.toLowerCase().includes(v.word.toLowerCase())) {
                        targetItem = v;
                        break;
                    }
                }
            }

            document.getElementById('progress').innerText = `題目：${currentIndex + 1} / ${quizBank.length}`;
            document.getElementById('score-board').innerText = `得分：${score}`;

            // 🌟 嚴格平衡：隨機抽選四種模式之一
            let availableModes = ['vocab_to_ch', 'ch_to_vocab']; // 純單字基礎模式
            if (currentGroup.sentenceEng && currentGroup.sentenceCh) {
                availableModes.push('sentence_blank', 'sentence_ch_to_eng'); // 例句進階模式
            }
            const mode = availableModes[Math.floor(Math.random() * availableModes.length)];
           


const modeBadge = document.getElementById('mode-badge');
const vocabBox = document.getElementById('q-vocab-box');
const sentenceBox = document.getElementById('q-sentence-box');
const sentenceChBox = document.getElementById('q-sentence-ch-box');
const targetMeaningBox = document.getElementById('q-target-meaning-box');
// 預設全隱藏
vocabBox.classList.add('hidden');
sentenceBox.classList.add('hidden');
sentenceChBox.classList.add('hidden');
targetMeaningBox.classList.add('hidden');
// 用來準備選單答案的正確目標
let correctAnswerString = "";
let wrongOptionsPool = [];
if (mode === 'vocab_to_ch') {
// 1. 英翻中
modeBadge.innerText = '📖 單字英翻中';
modeBadge.className = "px-2 py-0.5 text-xs rounded-full font-bold bg-amber-100 text-amber-700";
vocabBox.classList.remove('hidden');
document.getElementById('q-vocab-title').innerText = "請選出正確的中文意思：";
document.getElementById('q-vocab-main').innerText = targetItem.word;
correctAnswerString = targetItem.meaning;
// 抓取其他群組的「中文意思」作為干擾項
quizBank.forEach((g, idx) => {
if (idx !== currentIndex) g.vocabularies.forEach(v => wrongOptionsPool.push(v.meaning));
});
} else if (mode === 'ch_to_vocab') {
// 2. 中翻英（你最需要的單字測驗回來了！）
modeBadge.innerText = '🔤 單字中翻英';
modeBadge.className = "px-2 py-0.5 text-xs rounded-full font-bold bg-pink-100 text-pink-700";
vocabBox.classList.remove('hidden');
document.getElementById('q-vocab-title').innerText = "請選出對應的英文單字：";
document.getElementById('q-vocab-main').innerText = targetItem.meaning;
correctAnswerString = targetItem.word;
quizBank.forEach((g, idx) => {
if (idx !== currentIndex) g.vocabularies.forEach(v => wrongOptionsPool.push(v.word));
});
} else if (mode === 'sentence_blank') {
// 3. 例句克漏字
modeBadge.innerText = '📝 例句克漏字';
modeBadge.className = "px-2 py-0.5 text-xs rounded-full font-bold bg-indigo-100 text-indigo-700";
sentenceBox.classList.remove('hidden');
targetMeaningBox.classList.remove('hidden');
const escapedWord = targetItem.word.replace(/[-/\^$+?.()|[]{}]/g, '$&');
const regex = new RegExp(escapedWord + '[a-z]', 'gi');
document.getElementById('q-sentence').innerText = currentGroup.sentenceEng.replace(regex, '_______');
document.getElementById('q-chinese').innerText = currentGroup.sentenceCh;
document.getElementById('q-target-meaning').innerText = targetItem.meaning;
correctAnswerString = targetItem.word;
quizBank.forEach((g, idx) => {
if (idx !== currentIndex) g.vocabularies.forEach(v => wrongOptionsPool.push(v.word));
});
} else if (mode === 'sentence_ch_to_eng') {
// 4. 例句中翻英
modeBadge.innerText = '💡 例句中翻英';
modeBadge.className = "px-2 py-0.5 text-xs rounded-full font-bold bg-cyan-100 text-cyan-700";
sentenceChBox.classList.remove('hidden');
targetMeaningBox.classList.remove('hidden');
document.getElementById('q-sentence-only-ch').innerText = currentGroup.sentenceCh;
document.getElementById('q-target-meaning').innerText = targetItem.meaning;
correctAnswerString = targetItem.word;
quizBank.forEach((g, idx) => {
if (idx !== currentIndex) g.vocabularies.forEach(v => wrongOptionsPool.push(v.word));
});
}
// 防呆干擾項
if (wrongOptionsPool.length < 3) {
wrongOptionsPool = (mode === 'vocab_to_ch') ? ['管理', '精通', '熟悉', '勤奮'] : ['manage', 'proficient', 'familiar', 'diligent'];
}
// 產生隨機 4 個不重複的選項
wrongOptionsPool = [...new Set(wrongOptionsPool)].filter(item => item !== correctAnswerString);
wrongOptionsPool.sort(() => Math.random() - 0.5);
let options = [correctAnswerString].concat(wrongOptionsPool.slice(0, 3));
options.sort(() => Math.random() - 0.5);
// 預備好答題後的對照與出題重點欄位
document.getElementById('q-review-vocab').innerText = ${targetItem.word} ➔ ${targetItem.meaning};
document.getElementById('q-review-sentence').innerText = currentGroup.sentenceEng ? 例句：${currentGroup.sentenceEng} : '';
document.getElementById('q-focus-box').classList.add('hidden');
const container = document.getElementById('options-container');
container.innerHTML = '';
document.getElementById('next-btn').classList.add('hidden');
options.forEach(opt => {
const btn = document.createElement('button');
btn.className = "w-full py-3.5 px-5 text-left font-semibold border border-slate-200 rounded-xl hover:bg-slate-50 transition-all text-base active:bg-slate-100 flex justify-between items-center bg-white";
btn.innerText = opt;
btn.addEventListener('click', () => checkAnswer(btn, opt, correctAnswerString, currentGroup.focus));
container.appendChild(btn);
});
}
function checkAnswer(selectedBtn, selectedOpt, correctOpt, focusText) {
const buttons = document.getElementById('options-container').querySelectorAll('button');
buttons.forEach(btn => btn.disabled = true);
if (selectedOpt === correctOpt) {
selectedBtn.className = selectedBtn.className.replace('border-slate-200', 'border-emerald-500 bg-emerald-50 text-emerald-700');
selectedBtn.innerHTML += '✅ 正確';
score += 10;
} else {
selectedBtn.className = selectedBtn.className.replace('border-slate-200', 'border-rose-500 bg-rose-50 text-rose-700');
selectedBtn.innerHTML += '❌ 錯誤';
buttons.forEach(btn => {
if (btn.innerText === correctOpt) {
btn.className = btn.className.replace('border-slate-200', 'border-emerald-500 bg-emerald-50 text-emerald-700');
}
});
}
// 答完後一律展開複習對照區
document.getElementById('q-focus-box').classList.remove('hidden');
if (focusText) {
document.getElementById('q-focus').innerText = focusText;
document.getElementById('q-focus-title-div').classList.remove('hidden');
} else {
document.getElementById('q-focus').innerText = "";
document.getElementById('q-focus-title-div').classList.add('hidden');
}
document.getElementById('score-board').innerText = 得分：${score};
document.getElementById('next-btn').classList.remove('hidden');
}
document.getElementById('next-btn').addEventListener('click', () => {
currentIndex++;
loadQuestion();
});
function showResult() {
gameScreen.classList.add('hidden');
resultScreen.classList.remove('hidden');
document.getElementById('final-score').innerText = 您的最終得分為：${score} 分！;
}
