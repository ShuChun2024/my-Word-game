<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">

<title>英文單字手機小遊戲</title>

<style>

/* =========================================================
   基本設定
========================================================= */

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 0;
    background: linear-gradient(135deg, #eef4ff, #f8fafc);
    color: #1e293b;
    font-family:
        Arial,
        "Microsoft JhengHei",
        "Noto Sans TC",
        sans-serif;
}

.container {
    width: 100%;
    max-width: 760px;
    margin: auto;
    padding: 12px;
}

h1 {
    text-align: center;
    color: #1e40af;
    margin: 8px 0 18px;
    font-size: 27px;
}

.panel {
    background: white;
    border-radius: 16px;
    padding: 16px;
    margin-bottom: 14px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.08);
}


/* =========================================================
   輸入區
========================================================= */

textarea {
    width: 100%;
    min-height: 240px;
    padding: 13px;
    border: 2px solid #cbd5e1;
    border-radius: 12px;
    font-size: 16px;
    line-height: 1.7;
    resize: vertical;
    outline: none;
}

textarea:focus {
    border-color: #2563eb;
}

.file-row {
    margin-top: 10px;
}

.file-label {
    display: block;
    background: #475569;
    color: white;
    text-align: center;
    padding: 14px;
    border-radius: 10px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

input[type="file"] {
    display: none;
}

.generate-btn {
    width: 100%;
    margin-top: 12px;
    background: #2563eb;
    color: white;
    font-size: 18px;
}

.generate-btn:active {
    transform: scale(0.98);
}

.word-count {
    margin-top: 8px;
    color: #64748b;
    font-size: 14px;
}


/* =========================================================
   遊戲資訊
========================================================= */

.game-info {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
}

.info-box {
    background: #f1f5f9;
    border-radius: 10px;
    text-align: center;
    padding: 10px 5px;
}

.info-title {
    font-size: 13px;
    color: #64748b;
}

.info-value {
    font-size: 21px;
    font-weight: bold;
    margin-top: 3px;
}


/* =========================================================
   模式按鈕
========================================================= */

.mode-buttons {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-top: 14px;
}

.mode-btn {
    border: none;
    border-radius: 10px;
    padding: 13px 5px;
    font-size: 15px;
    font-weight: bold;
    background: #e2e8f0;
    color: #334155;
    cursor: pointer;
}

.mode-btn.active {
    background: #7c3aed;
    color: white;
}


/* =========================================================
   通用按鈕
========================================================= */

button {
    border: none;
    border-radius: 10px;
    cursor: pointer;
    font-weight: bold;
}

.next-btn {
    width: 100%;
    background: #0f766e;
    color: white;
    padding: 14px;
    font-size: 17px;
    margin-top: 12px;
}

.hidden {
    display: none !important;
}


/* =========================================================
   題目
========================================================= */

.question-number {
    text-align: center;
    color: #64748b;
    margin-bottom: 12px;
}

.sentence {
    background: #f8fafc;
    border-left: 5px solid #3b82f6;
    padding: 16px;
    border-radius: 10px;
    font-size: 19px;
    line-height: 1.7;
    margin-bottom: 16px;
}


/* =========================================================
   A 模式：克漏字
========================================================= */

.options {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
}

.option {
    min-height: 58px;
    padding: 10px;
    background: #eef2ff;
    color: #1e3a8a;
    font-size: 18px;
}

.option.correct {
    background: #22c55e !important;
    color: white !important;
}

.option.wrong {
    background: #ef4444 !important;
    color: white !important;
}

.feedback {
    min-height: 32px;
    margin-top: 15px;
    text-align: center;
    font-size: 18px;
    font-weight: bold;
}

.correct-text {
    color: #16a34a;
}

.wrong-text {
    color: #dc2626;
}


/* =========================================================
   B 模式：Wordle
========================================================= */

.definition-box {
    background: #f8fafc;
    border-radius: 10px;
    padding: 15px;
    line-height: 1.7;
    font-size: 17px;
}

.wordle-board {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    margin: 18px 0;
    overflow-x: auto;
}

.word-row {
    display: flex;
    gap: 5px;
}

.letter-box {
    width: 43px;
    height: 43px;
    border: 2px solid #cbd5e1;
    border-radius: 6px;

    display: flex;
    justify-content: center;
    align-items: center;

    font-size: 21px;
    font-weight: bold;
}

.letter-box.correct {
    background: #22c55e;
    color: white;
    border-color: #22c55e;
}

.letter-box.present {
    background: #eab308;
    color: white;
    border-color: #eab308;
}

.letter-box.absent {
    background: #64748b;
    color: white;
    border-color: #64748b;
}

.word-input {
    width: 100%;
    padding: 14px;
    border: 2px solid #cbd5e1;
    border-radius: 10px;
    font-size: 20px;
    text-align: center;
    text-transform: uppercase;
    letter-spacing: 3px;
    outline: none;
}

.word-input:focus {
    border-color: #7c3aed;
}

.submit-word {
    width: 100%;
    padding: 14px;
    margin-top: 8px;
    background: #7c3aed;
    color: white;
    font-size: 17px;
}


/* =========================================================
   C 模式：中翻英
========================================================= */

.translation-box {
    background: #f8fafc;
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 14px;
}

.translation-title {
    color: #64748b;
    font-size: 14px;
    margin-bottom: 5px;
}

.translation-word {
    font-size: 25px;
    font-weight: bold;
    color: #1e40af;
    line-height: 1.5;
}

.chinese-example {
    font-size: 19px;
    line-height: 1.8;
    color: #334155;
}

.translation-input {
    width: 100%;
    padding: 15px;
    border: 2px solid #cbd5e1;
    border-radius: 10px;
    font-size: 22px;
    text-align: center;
    outline: none;
}

.translation-input:focus {
    border-color: #2563eb;
}

.check-translation {
    width: 100%;
    padding: 14px;
    margin-top: 10px;
    background: #2563eb;
    color: white;
    font-size: 17px;
}


/* =========================================================
   開始畫面
========================================================= */

.welcome {
    text-align: center;
    color: #64748b;
}

.welcome-icon {
    font-size: 55px;
}

.welcome h2 {
    color: #334155;
}


/* =========================================================
   手機
========================================================= */

@media (max-width: 480px) {

    .container {
        padding: 8px;
    }

    h1 {
        font-size: 24px;
    }

    .mode-btn {
        font-size: 13px;
        padding: 12px 3px;
    }

    .sentence {
        font-size: 17px;
    }

    .option {
        font-size: 16px;
    }

    .letter-box {
        width: 37px;
        height: 37px;
        font-size: 18px;
    }

    .translation-word {
        font-size: 22px;
    }

    .chinese-example {
        font-size: 17px;
    }
}

</style>
</head>


<body>

<div class="container">

<h1>📚 英文單字挑戰</h1>


<!-- =====================================================
     TXT 輸入
===================================================== -->

<div class="panel">

<textarea
id="textInput"
placeholder="請貼上英文單字教材 TXT 內容，例如：

position

職位；位置

The advertised position provides health care and other benefits.

廣告上的職位提供醫療保健和其他福利。

position

放置

The secretary positioned the chairs around the table before the meeting began.

秘書在會議開始前把椅子擺放在了桌子周圍。"
></textarea>


<div class="file-row">

<label
class="file-label"
for="fileInput"
>
📂 上傳 .txt 檔
</label>

<input
type="file"
id="fileInput"
accept=".txt,text/plain"
>

class="word-count"

>

<!-- =====================================================

===================================================== -->

id="gamePanel"
>

<div class="game-info">

<div class="info-box">
<div class="info-title">分數</div>
<div
class="info-value"
id="score"
>
0
</div>
</div>

<div class="info-box">
<div class="info-title">題目</div>
<div class="info-value">
<span id="currentQuestion">0</span>
/
<span id="totalQuestion">0</span>
</div>
</div>

<div class="info-box">
<div class="info-title">單字</div>
<div
class="info-value"
id="totalWords"
>
0
</div>
</div>

</div>


<div class="mode-buttons">

<button
id="modeAButton"
class="mode-btn active"

>
A 克漏字

>

<!-- =====================================================

===================================================== -->

<div

第 <span id="bQuestionNumber">1</span> 題
</div>


<div

>
</div>


<input
id="wordInput"

===================================================== -->

<div

id="modeCPanel"
>

第 <span id="cQuestionNumber">1</span> 題
</div>


<div class="translation-box">

<div class="translation-title">
中文單字意思
</div>

class="translation-word"
id="translationMeaning"
>
</div>

</div>

>

class="check-translation"
onclick="checkTranslation()"

✓ 確認答案
</button>

class="feedback"
id="cFeedback"
>
</div>

id="cNextButton"
class="next-btn hidden"
onclick="nextQuestion()"
>
下一題 →
</button>

</div>


<!-- =====================================================
     歡迎畫面
===================================================== -->

<div
class="panel"
id="welcomePanel"
>

<div class="welcome">

<div class="welcome-icon">
🎯
</div>

<h2>準備開始</h2>

<p>
請貼上英文單字教材，
或上傳 TXT 檔案。
</p>

<p>
系統會自動分析：
</p>

<p>
<strong>
英文單字 → 中文意思 → 英文例句 → 中文例句
</strong>
</p>

</div>

</div>

</div>


<script>

/* =========================================================
   全域資料
========================================================= */

let originalText = "";

let vocabulary = [];

let questions = [];

let currentIndex = 0;

let score = 0;

let currentMode = "A";

let currentQuestion = null;

let answered = false;


/* =========================================================
   TXT 上傳
========================================================= */

document
.getElementById("fileInput")
.addEventListener(
    "change",
    function(event) {

        const file =
            event.target.files[0];

        if (!file) {
            return;
        }

        if (
            !file.name
            .toLowerCase()
            .endsWith(".txt")
        ) {

            alert(
                "請選擇 TXT 檔案。"
            );

            return;
        }

        const reader =
            new FileReader();

        reader.onload =
            function(e) {

                document
                .getElementById("textInput")
                .value =
                    e.target.result;

                updateWordCount();

            };

        reader.readAsText(
            file,
            "UTF-8"
        );

    }
);


/* =========================================================
   清理文字
========================================================= */

function cleanLines(text) {

    return text
        .replace(/\r\n/g, "\n")
        .replace(/\r/g, "\n")
        .split("\n")
        .map(line => line.trim())
        .filter(line => line !== "");

}


/* =========================================================
   判斷是不是英文單字
========================================================= */

function isEnglishWord(line) {

    /*
        至少 6 個英文字母
    */

    return /^[A-Za-z][A-Za-z'-]{5,}$/.test(
        line
    );

}


/* =========================================================
   判斷英文例句
========================================================= */

function isEnglishSentence(line) {

    /*
        必須含英文，
        且通常有句點。
    */

    const letters =
        (line.match(/[A-Za-z]/g) || []).length;

    const chinese =
        (line.match(/[\u4e00-\u9fff]/g) || []).length;

    if (letters < 10) {
        return false;
    }

    /*
        英文比例較高
    */

    return letters > chinese * 2;

}


/* =========================================================
   判斷中文
========================================================= */

function isChineseText(line) {

    const chinese =
        (line.match(/[\u4e00-\u9fff]/g) || []).length;

    return chinese >= 2;

}


/* =========================================================
   排除教材標題
========================================================= */

function isIgnoreTitle(line) {

    const titles = [

        "常考語句",
        "出題重點",
        "易混淆單字",
        "同義",
        "反義",
        "衍生",
        "相關",
        "片語",
        "搭配",
        "例句",
        "測驗",
        "補充",
        "說明"

    ];

    return titles.includes(line);

}


/* =========================================================
   解析教材
========================================================= */

function parseVocabulary(text) {

    const lines =
        cleanLines(text);

    const results = [];

    for (
        let i = 0;
        i < lines.length;
        i++
    ) {

        const line =
            lines[i];

        /*
            找英文單字
        */

        if (
            !isEnglishWord(line)
        ) {
            continue;
        }

        /*
            排除明顯標題
        */

        if (
            isIgnoreTitle(line)
        ) {
            continue;
        }

        const word =
            line.toLowerCase();

        /*
            下一行必須是中文意思
        */

        let meaning = "";

        let meaningIndex = -1;

        for (
            let j = i + 1;
            j < Math.min(i + 4, lines.length);
            j++
        ) {

            if (
                isChineseText(lines[j])
            ) {

                meaning =
                    lines[j];

                meaningIndex =
                    j;

                break;

            }

        }

        if (
            !meaning
        ) {
            continue;
        }


        /*
            尋找英文例句
        */

        let englishExample = "";

        let englishIndex = -1;

        for (
            let j = meaningIndex + 1;
            j < Math.min(
                meaningIndex + 5,
                lines.length
            );
            j++
        ) {

            if (
                isEnglishSentence(lines[j])
            ) {

                englishExample =
                    lines[j];

                englishIndex =
                    j;

                break;

            }

        }

        if (
            !englishExample
        ) {
            continue;
        }


        /*
            尋找中文例句
        */

        let chineseExample = "";

        for (
            let j = englishIndex + 1;
            j < Math.min(
                englishIndex + 4,
                lines.length
            );
            j++
        ) {

            if (
                isChineseText(lines[j])
            ) {

                chineseExample =
                    lines[j];

                break;

            }

        }


        /*
            確認英文例句真的包含這個單字
        */

        const wordRegex =
            new RegExp(
                "\\b" +
                escapeRegExp(word) +
                "\\b",
                "i"
            );

        /*
            有些教材會出現：
            achieve / achievement
            因此不一定完全一致。
        */

        const containsWord =
            wordRegex.test(
                englishExample
            );


        /*
            只有例句真的包含目標單字
            才建立克漏字題目
        */

        if (
            !containsWord
        ) {
            continue;
        }


        results.push({

            word:
                word,

            meaning:
                meaning,

            englishExample:
                englishExample,

            chineseExample:
                chineseExample

        });

    }

    return results;

}


/* =========================================================
   顯示解析數量
========================================================= */

function updateWordCount() {

    const text =
        document
        .getElementById("textInput")
        .value;

    const data =
        parseVocabulary(text);

    document
    .getElementById("wordCount")
    .textContent =
        `解析到 ${data.length} 筆完整單字資料`;

}


/* =========================================================
   監聽輸入
========================================================= */

document
.getElementById("textInput")
.addEventListener(
    "input",
    updateWordCount
);


/* =========================================================
   生成遊戲
========================================================= */

function generateGame() {

    originalText =
        document
        .getElementById("textInput")
        .value
        .trim();

    if (!originalText) {

        alert(
            "請先貼上教材或上傳 TXT 檔案。"
        );

        return;
    }


    vocabulary =
        parseVocabulary(
            originalText
        );


    if (
        vocabulary.length === 0
    ) {

        alert(
            "沒有解析到完整的單字資料。\n\n" +

            "請確認 TXT 格式為：\n\n" +

            "英文單字\n" +
            "中文意思\n" +
            "英文例句\n" +
            "中文例句"
        );

        return;
    }


    questions =
        [...vocabulary];

    shuffle(questions);

    currentIndex = 0;

    score = 0;

    answered = false;


    document
    .getElementById("score")
    .textContent =
        score;

    document
    .getElementById("totalWords")
    .textContent =
        vocabulary.length;

    document
    .getElementById("totalQuestion")
    .textContent =
        questions.length;


    document
    .getElementById("welcomePanel")
    .classList
    .add("hidden");


    document
    .getElementById("gamePanel")
    .classList
    .remove("hidden");


    setMode(
        currentMode
    );

}


/* =========================================================
   模式切換
========================================================= */

function setMode(mode) {

    currentMode =
        mode;


    document
    .getElementById("modeAButton")
    .classList
    .toggle(
        "active",
        mode === "A"
    );


    document
    .getElementById("modeBButton")
    .classList
    .toggle(
        "active",
        mode === "B"
    );


    document
    .getElementById("modeCButton")
    .classList
    .toggle(
        "active",
        mode === "C"
    );


    document
    .getElementById("modeAPanel")
    .classList
    .toggle(
        "hidden",
        mode !== "A"
    );


    document
    .getElementById("modeBPanel")
    .classList
    .toggle(
        "hidden",
        mode !== "B"
    );


    document
    .getElementById("modeCPanel")
    .classList
    .toggle(
        "hidden",
        mode !== "C"
    );


    if (
        questions.length > 0
    ) {

        loadQuestion();

    }

}


/* =========================================================
   載入題目
========================================================= */

function loadQuestion() {

    if (
        currentIndex >= questions.length
    ) {

        finishGame();

        return;
    }


    answered =
        false;


    currentQuestion =
        questions[currentIndex];


    document
    .getElementById("currentQuestion")
    .textContent =
        currentIndex + 1;


    if (
        currentMode === "A"
    ) {

        loadModeA();

    }
    else if (
        currentMode === "B"
    ) {

        loadModeB();

    }
    else {

        loadModeC();

    }

}


/* =========================================================
   A：克漏字
========================================================= */

function loadModeA() {

    document
    .getElementById("aQuestionNumber")
    .textContent =
        currentIndex + 1;


    document
    .getElementById("aFeedback")
    .textContent =
        "";


    document
    .getElementById("aNextButton")
    .classList
    .add("hidden");


    const target =
        currentQuestion.word;


    /*
        確保例句真的包含單字
    */

    const regex =
        new RegExp(
            "\\b" +
            escapeRegExp(target) +
            "\\b",
            "gi"
        );


    if (
        !regex.test(
            currentQuestion.englishExample
        )
    ) {

        currentIndex++;

        loadQuestion();

        return;

    }


    /*
        重新建立 regex
    */

    const maskRegex =
        new RegExp(
            "\\b" +
            escapeRegExp(target) +
            "\\b",
            "gi"
        );


    const sentence =
        currentQuestion
        .englishExample
        .replace(
            maskRegex,
            "___"
        );


    document
    .getElementById("sentence")
    .textContent =
        sentence;


    /*
        建立四個選項
    */

    let options =
        [target];


    const others =
        vocabulary
        .filter(
            item =>
                item.word !== target
        );


    shuffle(others);


    others
    .slice(0, 3)
    .forEach(item => {

        if (
            !options.includes(
                item.word
            )
        ) {

            options.push(
                item.word
            );

        }

    });


    shuffle(options);


    const container =
        document
        .getElementById("options");


    container.innerHTML =
        "";


    options.forEach(
        word => {

            const button =
                document
                .createElement("button");


            button.className =
                "option";


            button.textContent =
                word;


            button.onclick =
                () =>
                    checkModeA(
                        button,
                        word
                    );


            container
            .appendChild(
                button
            );

        }
    );

}


/* =========================================================
   A：答案
========================================================= */

function checkModeA(
    button,
    answer
) {

    if (answered) {
        return;
    }


    answered =
        true;


    const correct =
        currentQuestion.word;


    const buttons =
        document
        .querySelectorAll(
            "#options .option"
        );


    buttons.forEach(
        btn => {

            btn.disabled =
                true;


            if (
                btn.textContent
                .toLowerCase() ===
                correct
            ) {

                btn.classList
                .add("correct");

            }

        }
    );


    if (
        answer.toLowerCase() ===
        correct
    ) {

        score += 10;


        document
        .getElementById("aFeedback")
        .textContent =
            "🎉 答對了！ +10 分";


        document
        .getElementById("aFeedback")
        .className =
            "feedback correct-text";


        button.classList
        .add("correct");

    }
    else {

        score -= 5;


        document
        .getElementById("aFeedback")
        .textContent =
            `❌ 答錯了！正確答案：${correct}  -5 分`;


        document
        .getElementById("aFeedback")
        .className =
            "feedback wrong-text";


        button.classList
        .add("wrong");

    }


    document
    .getElementById("score")
    .textContent =
        score;


    document
    .getElementById("aNextButton")
    .classList
    .remove("hidden");

}

/* =========================================================
   Wordle Board
========================================================= */

function createWordleBoard(
    length
) {

    const board =
        document
        .getElementById(
            "wordleBoard"
        );


    board.innerHTML =
        "";


    for (
        let row = 0;
        row < 6;
        row++
    ) {

        const wordRow =
            document
            .createElement("div");


        wordRow.className =
            "word-row";


        for (
            let i = 0;
            i < length;
            i++
        ) {

            const box =
                document
                .createElement("div");


            box.className =
                "letter-box";


            wordRow
            .appendChild(
                box
            );

        }


        board
        .appendChild(
            wordRow
        );

    }

}


/* =========================================================
   Wordle 答題
========================================================= */

function submitWord() {

    if (answered) {
        return;
    }


    const input =
        document
        .getElementById(
            "wordInput"
        )
        .value
        .trim()
        .toLowerCase();


    const target =
        currentQuestion.word
        .toLowerCase();


    if (
        !/^[a-z]+$/.test(input)
    ) {

        alert(
            "請只輸入英文字母。"
        );

        return;
    }


    if (
        input.length !==
        target.length
    ) {

        alert(
            `請輸入 ${target.length} 個字母。`
        );

        return;
    }


    const rows =
        document
        .querySelectorAll(
            "#wordleBoard .word-row"
        );


    let rowIndex = -1;


    for (
        let i = 0;
        i < rows.length;
        i++
    ) {

        if (
            !rows[i]
            .querySelector(
                ".letter-box"
            )
            .classList
            .contains("used")
        ) {

            rowIndex =
                i;

            break;

        }

    }


    if (
        rowIndex === -1
    ) {

        return;
    }


    const boxes =
        rows[rowIndex]
        .querySelectorAll(
            ".letter-box"
        );


    const result =
        Array(
            target.length
        )
        .fill("absent");


    const targetLetters =
        target.split("");


    const inputLetters =
        input.split("");


    /*
        第一輪：
        完全正確
    */

    for (
        let i = 0;
        i < target.length;
        i++
    ) {

        if (
            inputLetters[i] ===
            targetLetters[i]
        ) {

            result[i] =
                "correct";

            targetLetters[i] =
                null;

        }

    }


    /*
        第二輪：
        字母存在但位置錯誤
    */

    for (
        let i = 0;
        i < target.length;
        i++
    ) {

        if (
            result[i] ===
            "correct"
        ) {
            continue;
        }


        const index =
            targetLetters
            .indexOf(
                inputLetters[i]
            );


        if (
            index !== -1
        ) {

            result[i] =
                "present";

            targetLetters[index] =
                null;

        }

    }


    /*
        顯示
    */

    for (
        let i = 0;
        i < boxes.length;
        i++
    ) {

        boxes[i]
        .textContent =
            inputLetters[i]
            .toUpperCase();


        boxes[i]
        .classList
        .add(
            result[i]
        );


        boxes[i]
        .classList
        .add(
            "used"
        );

    }


    /*
        答對
    */

    if (
        input === target
    ) {

        answered =
            true;

        score += 10;


        document
        .getElementById("bFeedback")
        .textContent =
            "🎉 答對了！ +10 分";


        document
        .getElementById("bFeedback")
        .className =
            "feedback correct-text";


        document
        .getElementById("bNextButton")
        .classList
        .remove("hidden");

    }
    else {

        let remaining =
            false;


        for (
            let i = 0;
            i < rows.length;
            i++
        ) {

            if (
                !rows[i]
                .querySelector(
                    ".letter-box"
                )
                .classList
                .contains("used")
            ) {

                remaining =
                    true;

                break;

            }

        }


        if (
            !remaining
        ) {

            answered =
                true;

            score -= 5;


            document
            .getElementById(
                "bFeedback"
            )
            .textContent =
                `❌ 挑戰失敗！正確答案：${target}  -5 分`;


            document
            .getElementById(
                "bFeedback"
            )
            .className =
                "feedback wrong-text";


            document
            .getElementById(
                "bNextButton"
            )
            .classList
            .remove("hidden");

        }
        else {

            document
            .getElementById(
                "bFeedback"
            )
            .textContent =
                "再試一次！";

        }

    }


    document
    .getElementById("score")
    .textContent =
        score;


    document
    .getElementById("wordInput")
    .value =
        "";


    document
    .getElementById("wordInput")
    .focus();

}

        0;

        questions
    );


    loadQuestion();

}


/* =========================================================
   洗牌
========================================================= */

function shuffle(array) {

    for (
        let i =
            array.length - 1;
        i > 0;
        i--
    ) {

        const j =
            Math.floor(
                Math.random() *
                (i + 1)
            );


        [
            array[i],
            array[j]
        ] =
        [
            array[j],
            array[i]
        ];

    }

}


/* =========================================================
   Escape RegExp
========================================================= */

function escapeRegExp(string) {

    return string.replace(
        /[.*+?^${}()|[\]\\]/g,
        "\\$&"
    );

}


/* =========================================================
   Escape HTML
========================================================= */

function escapeHtml(text) {

    const div =
        document
        .createElement("div");

    div.textContent =
        text;

    return div.innerHTML;

}
